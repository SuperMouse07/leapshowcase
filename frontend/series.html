<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEAP · Series</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/storefront.css" />
</head>
<!-- 单一参数化系列页：series.html?cat=<id>（取代旧版四个分类 HTML）；
     data-cat 由 series.js 在注入外壳前设定，用于导航高亮。 -->
<body data-page="series">
  <main>
    <header class="cat-hero">
      <span class="micro-label" id="catKicker"></span>
      <h1 class="sec-title" id="catTitle"></h1>
      <p class="sec-sub" id="catTagline" style="margin:0 auto;"></p>
      <div class="filter-bar" id="catNav" style="margin:28px 0 0;"></div>
    </header>
    <div class="checker-band" aria-hidden="true"></div>
    <section class="section">
      <div class="wrap">
        <div class="ov-head">
          <h3>Pieces in this series</h3>
          <span class="ov-count" id="catCount"></span>
        </div>
        <div class="masonry" id="grid"></div>
      </div>
    </section>
  </main>

  <script type="module" src="js/pages/series.js"></script>
</body>
</html>
